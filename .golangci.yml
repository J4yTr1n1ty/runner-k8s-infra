run:
  timeout: 3m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gosec
    - bodyclose
    - goconst
    - gocyclo
    - dupl
    - lll
  disable-all: false

linters-settings:
  cyclop:
    max-complexity: 15
    package-average: 10.0
    skip-tests: true

  dupl:
    threshold: 100

  errcheck:
    check-type-assertions: true
    check-blank: true

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  funlen:
    lines: 100
    statements: 60

  gci:
    sections:
      - standard
      - default
      - prefix(github.com/J4yTr1n1ty/runner-k8s-infra)
    skip-generated: true

  gocognit:
    min-complexity: 15

  gocyclo:
    min-complexity: 15

  godot:
    scope: declarations
    capital: true

  godox:
    keywords:
      - NOTE
      - OPTIMIZE
      - HACK

  goheader:
    values:
      const:
        COMPANY: J4yTr1n1ty
      regexp:
        YEAR: 20\d\d
    template: |
      Copyright {{YEAR}} {{COMPANY}}
      
      Licensed under the Apache License, Version 2.0 (the "License");
      you may not use this file except in compliance with the License.
      You may obtain a copy of the License at
      
          http://www.apache.org/licenses/LICENSE-2.0
      
      Unless required by applicable law or agreed to in writing, software
      distributed under the License is distributed on an "AS IS" BASIS,
      WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      See the License for the specific language governing permissions and
      limitations under the License.

  gomnd:
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
    ignored-functions:
      - 'args.Error'
      - 'flag.Arg'
      - 'os.Exit'

  gosec:
    excludes:
      - G204 # Subprocess launched with variable
      - G304 # File path provided as taint input
    
  govet:
    check-shadowing: true
    enable-all: true

  lll:
    line-length: 120

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30

  nestif:
    min-complexity: 4

  nlreturn:
    block-size: 2

  nolintlint:
    allow-leading-space: false
    require-explanation: true
    require-specific: true

  paralleltest:
    ignore-missing: true

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: range
      - name: time-naming
      - name: context-as-argument
      - name: context-keys-type
      - name: indent-error-flow

  staticcheck:
    checks: ["all"]

  stylecheck:
    checks: ["all"]

  tagliatelle:
    case:
      rules:
        json: snake

  tenv:
    all: true

  varnamelen:
    min-name-length: 2
    ignore-names:
      - err
      - i
      - id
      - ok
      - ctx

  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(

issues:
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - funlen
        - gochecknoglobals
        - goconst
        - gocyclo
        - gosec
        - lll
        - paralleltest
        - wrapcheck

    - path: cmd/
      linters:
        - gochecknoinits
        - gochecknoglobals

  max-same-issues: 50
  max-issues-per-linter: 50