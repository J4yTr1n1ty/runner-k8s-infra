name: Weekly Maintenance

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  maintenance:
    name: Dependencies and Security
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.3"

    - name: Update dependencies and run security scan
      run: |
        # Update dependencies
        go get -u all
        go mod tidy
        
        # Run tests
        go test ./...
        
        # Simple security check
        go list -json -m all | grep -E '"Path|"Version'  || true

    - name: Run basic security scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: './...'
      continue-on-error: true

    - name: Create Pull Request if needed
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update dependencies"
        title: "Weekly dependency update"
        body: |
          Automated weekly maintenance:
          - Updated Go dependencies
          - Ran security checks
          - All tests pass
        branch: weekly-updates
        delete-branch: true