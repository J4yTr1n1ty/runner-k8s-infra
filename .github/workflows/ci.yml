name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.24.3"

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download and verify dependencies
      run: |
        go mod download
        go mod verify

    - name: Run tests with coverage
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: github.event_name == 'push'
      with:
        file: ./coverage.out

    - name: Run linter
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=3m

    - name: Build binaries (Linux only for CI)
      run: |
        mkdir -p dist
        go build -o dist/controller ./cmd/controller
        go build -o dist/deploy-runner ./cmd/deploy-runner

    - name: Validate Kubernetes manifests
      run: |
        # Validate non-template YAML files
        echo "Validating Kubernetes manifests..."
        for file in deploy/*.yaml; do
          # Skip template files (they have placeholders)
          if [[ "$(basename $file)" == *"template"* ]]; then
            echo "⏭️ Skipping template file: $(basename $file)"
            continue
          fi
          if ! python3 -c "import yaml; [doc for doc in yaml.safe_load_all(open('$file'))]" 2>/dev/null; then
            echo "❌ Invalid YAML: $file"
            exit 1
          else
            echo "✅ $(basename $file) is valid"
          fi
        done
        echo "✅ Manifest validation complete"

    - name: Basic security check
      run: |
        # Simple security check for hardcoded secrets (looking for actual values, not variable names)
        if grep -r -E "(password|secret|token)\s*[:=]\s*[\"'][^\"']{8,}[\"']" --include="*.go" . | grep -v "test"; then
          echo "⚠️ Potential security issue: hardcoded secrets detected"
          exit 1
        fi
        echo "✅ No obvious security issues found"