name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: "1.24.3"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run tests
      run: go test ./...

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Build multi-platform binaries
      run: |
        mkdir -p dist
        
        # Build for major platforms only
        platforms=("linux/amd64" "darwin/amd64" "windows/amd64")
        
        for platform in "${platforms[@]}"; do
          GOOS=${platform%/*}
          GOARCH=${platform#*/}
          
          echo "Building for $GOOS/$GOARCH..."
          
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          
          # Build both binaries
          env GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
            -ldflags="-w -s -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/controller-$GOOS-$GOARCH$EXT \
            ./cmd/controller
          
          env GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
            -ldflags="-w -s -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/deploy-runner-$GOOS-$GOARCH$EXT \
            ./cmd/deploy-runner
        done

    - name: Generate changelog
      id: changelog
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "changelog=Manual release" >> $GITHUB_OUTPUT
        else
          echo "changelog=Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## ${{ steps.changelog.outputs.changelog }}
          
          Download the appropriate binary for your platform:
          
          - **Linux**: controller-linux-amd64, deploy-runner-linux-amd64
          - **macOS**: controller-darwin-amd64, deploy-runner-darwin-amd64  
          - **Windows**: controller-windows-amd64.exe, deploy-runner-windows-amd64.exe
          
          See README.md for usage instructions.
        artifacts: "dist/*"
        draft: false
        prerelease: false