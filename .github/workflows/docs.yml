name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'config/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'config/**'

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24.3"

    - name: Check markdown and configs
      run: |
        # Simple markdown validation
        echo "Checking README structure..."
        if ! grep -q "# GitHub Actions Runners on Kubernetes" README.md; then
          echo "❌ README title not found"
          exit 1
        fi
        
        # Validate config examples
        echo "Validating configuration..."
        go build -o validate-config ./cmd/controller
        export GITHUB_TOKEN="fake-token-for-validation"
        ./validate-config -config config/config.yaml --help > /dev/null 2>&1 || echo "Config validation warning"
        
        echo "✅ Documentation validation complete"